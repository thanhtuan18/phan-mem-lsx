<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese" rel="stylesheet">

</head>
<body data-pt="3">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM7 3v6h8V3M7 21v-7h10v7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></symbol>
</svg>
<header class="topbar">
  <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg></div><div class="brand-text"><strong>Technoup</strong><span>Tiến độ sản xuất</span></div></div>
  <nav class="nav"><a class="nav-a" href="index.html">Lệnh sản xuất</a><a class="nav-a on" href="danh-muc.html">Danh mục</a><a class="nav-a" href="tong-quan.html">Tổng quan</a></nav>
  <div class="top-user"><div class="avatar" id="user-avatar">A</div><div class="user-info"><b id="user-name"></b><small id="user-company"></small></div><button class="logout" id="btn-logout" type="button"><svg class="i" style="width:16px;height:16px"><use href="#i-out"/></svg>Thoát</button></div>
</header>
<div class="page">
<h1>Danh mục</h1><p class="lead">Danh sách để chọn nhanh khi lập lệnh sản xuất. Sửa tên ở đây <b>không đổi</b> các lệnh đã lập.</p>
<div class="tabs" id="tabs"></div>
<div class="tools">
  <label class="search"><span class="sr-only">Tìm</span><svg class="i"><use href="#i-search"/></svg><input id="q" type="text" placeholder="Tìm theo tên hoặc mã" autocomplete="off"></label>
  <label class="chk"><input id="show-off" type="checkbox"> Hiện cả mục đã ngừng dùng</label>
  <button class="btn-add-main sp" id="btn-add" type="button"><svg class="i"><use href="#i-plus"/></svg><span id="btn-add-t">Thêm mới</span></button>
</div>
<div class="cat-card"><table class="cat-table"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table><div class="empty-cat" id="empty" hidden></div></div>
</div>
<div class="modal-back" id="modal-back"><form class="modal" id="quick-form" role="dialog" aria-modal="true" aria-labelledby="qm-title" novalidate>
  <h3 id="qm-title"></h3><p class="modal-sub" id="qm-sub"></p>
  <div class="modal-err" id="qm-err" role="alert"></div>
  <div class="field"><label for="qm-name" id="qm-name-label">Tên</label><input id="qm-name" type="text" maxlength="200" autocomplete="off"></div>
  <div class="modal-row">
    <div class="field"><label for="qm-code">Mã (không bắt buộc)</label><input id="qm-code" type="text" maxlength="20" autocomplete="off"></div>
    <div class="field"><label for="qm-extra" id="qm-extra-label"></label><input id="qm-extra" type="text" maxlength="50" autocomplete="off"></div>
  </div>
  <div class="field"><label for="qm-note">Ghi chú (không bắt buộc)</label><input id="qm-note" type="text" maxlength="255" autocomplete="off"></div>
  <div class="modal-actions"><button type="button" class="btn-secondary" id="qm-cancel">Hủy</button><button type="submit" class="btn-primary" id="qm-save">Lưu</button></div>
</form></div>
<div class="toast" id="toast" role="status"><svg class="i"><use href="#i-check"/></svg><span id="toast-text"></span></div>
<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/catalog.js"></script>
<script src="js/quick.js"></script>
<script src="js/catalog-page.js"></script>
</body>
</html>
